<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REMI S3 Auditor - MVP</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #38bdf8;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }
        textarea {
            width: 100%;
            height: 200px;
            background: #0f172a;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 16px;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }
        button:hover {
            background-color: #0284c7;
        }
        .result-box {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            display: none;
        }
        .secure {
            background-color: #064e3b;
            border: 1px solid #059669;
            color: #a7f3d0;
        }
        .vulnerable {
            background-color: #7f1d1d;
            border: 1px solid #dc2626;
            color: #fecaca;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛡️ REMI S3 Auditor</h1>
        <p class="subtitle">Pega la configuración de tu bucket (JSON o YAML / CloudFormation / Terraform) para evaluar brechas de seguridad críticas de forma instantánea.</p>
        
        <textarea id="configInput" placeholder="Pega tu configuración aquí...
Ejemplo:
Resources:
  MyS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false"></textarea>
        
        <button onclick="auditarConfiguracion()">Ejecutar Auditoría</button>
        
        <div id="resultBox" class="result-box"></div>
    </div>

    <script>
        async function auditarConfiguracion() {
            const configText = document.getElementById('configInput').value;
            const resultBox = document.getElementById('resultBox');

            if (!configText.trim()) {
                alert('Por favor, ingresa una configuración válida.');
                return;
            }

            resultBox.style.display = 'block';
            resultBox.className = 'result-box';
            resultBox.textContent = 'Analizando configuración...';

            try {
                const response = await fetch('http://localhost:5001/audit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ config: configText })
                });

                const data = await response.json();

                resultBox.textContent = JSON.stringify(data, null, 2);

                if (data.secure) {
                    resultBox.className = 'result-box secure';
                } else {
                    resultBox.className = 'result-box vulnerable';
                }

            } catch (error) {
                resultBox.className = 'result-box vulnerable';
                resultBox.textContent = 'Error de conexión con el micro-servicio local: ' + error.message;
            }
        }
    </script>

</body>
</html>
