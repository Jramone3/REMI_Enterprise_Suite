name: REMI Enterprise CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install "httpx<0.28.0" mongomock mcp pytest

    - name: Prepare source modules for testing
      run: |
        mkdir -p auth_gateways tests
        touch auth_gateways/__init__.py
        touch tests/__init__.py

    - name: Run pytest with Coverage
      env:
        PYTHONPATH: ".:auth_gateways"
      run: |
        pytest tests/ --cov=auth_gateways --cov-report=term-missing --cov-fail-under=20 -p no:pytest_ethereum

    - name: Build Docker Image
      run: |
        docker build -f devops_config/Dockerfile -t remi-enterprise:latest .

    - name: Integration Test Docker Container
      run: |
        docker run -d -p 8000:8000 --name remi-test-container remi-enterprise:latest
        sleep 3
        curl -f http://localhost:8000/ || exit 1
        docker stop remi-test-container
        docker rm remi-test-container
