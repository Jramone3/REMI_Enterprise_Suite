name: REMI Enterprise CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install "httpx<0.28.0" mongomock mcp pytest

    - name: Prepare source modules for testing
      run: |
        mkdir -p auth_gateways
        touch auth_gateways/__init__.py
        cp auth_gateways/*.py . || true

    - name: Run pytest
      env:
        PYTHONPATH: "."
      run: |
        pytest tests/ -p no:pytest_ethereum -q

    - name: Build Docker Image
      run: |
        docker build -f devops_config/Dockerfile -t remi-enterprise:latest .
