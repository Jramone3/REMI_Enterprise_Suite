# .github/workflows/ci.yml
name: REMI Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Instalar Dependencias del Sistema y Proyecto
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn requests pydantic pytest httpx pymongo pygithub

    - name: Ejecutar Pruebas Unitarias con Pytest
      env:
        TEST_MODE: "True"
        REMI_API_KEY: "test_admin_key_123"
      run: |
        pytest -v

    - name: Validar Construcción de Docker Image
      run: |
        docker build -t remi-enterprise-test:latest .
