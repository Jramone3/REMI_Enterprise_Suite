name: REMI Enterprise CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Lint with flake8
      run: |
        # Excluimos carpetas anidadas, venvs y submódulos para evitar recursión
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=bunker_respaldo,graphify-out,node_modules,.git
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics --exclude=bunker_respaldo,graphify-out,node_modules,.git

    - name: Test with pytest
      run: |
        pytest --cov=. --cov-report=xml

    - name: Build Docker Image
      run: |
        docker build -f devops_config/Dockerfile -t remi-enterprise:latest .
