name: REMI Core CI/CD Pipeline

on:
  push:
    branches: [ main, master, clean/v1.0 ]
  pull_request:
    branches: [ main, master, clean/v1.0 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        which python
        python --version
        python -m pip install --upgrade pip
        python -m pip install pytest pytest-cov pytest-mock fastapi httpx openai pydantic mongomock mcp pymongo python-dotenv web3 requests
        for req in requirements.txt requirements-dev.txt devops_config/requirements.txt devops_config/requirements-dev.txt; do
          if [ -f "$req" ]; then python -m pip install -r "$req" || true; fi
        done

    - name: Run Tests with Coverage Gate (45%)
      run: |
        PYTHONPATH=.:auth_gateways python -m pytest -v

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: .coverage

    - name: Build Docker Image
      run: |
        docker build -f devops_config/Dockerfile -t remi-enterprise:latest .

    - name: Integration Test Docker Container
      run: |
        docker run -d --network host -e MONGO_URI="mongodb://localhost:27017" --name remi-test-container remi-enterprise:latest
        
        cleanup() {
          echo "=== LIMPIEZA DE CONTENEDOR ==="
          docker stop remi-test-container || true
          docker rm remi-test-container || true
        }
        trap cleanup EXIT

        for i in {1..30}; do
          if curl -s http://localhost:5000/; then
            echo "Container is up!"
            break
          fi
          echo "Waiting for container (attempt $i/30)..."
          sleep 3
        done

        if ! curl -f http://localhost:5000/; then
          echo "=== CONTAINER LOGS ==="
          docker logs remi-test-container
          exit 1
        fi
        docker stop remi-test-container
        docker rm remi-test-container
