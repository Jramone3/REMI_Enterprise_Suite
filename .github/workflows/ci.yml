name: REMI Enterprise CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Actualizar pip, setuptools y wheel
      run: |
        python -m pip install --upgrade pip setuptools wheel

    - name: Instalar dependencias de producción
      run: |
        pip install -r requirements.txt

    - name: Instalar dependencias de desarrollo y testing
      run: |
        pip install -r requirements-dev.txt

    - name: Validar linting con flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Ejecutar pruebas unitarias con pytest y coverage
      env:
        MONGO_URI: "mongodb+srv://mock_user:mock_pass@cluster.mock.mongodb.net/test?retryWrites=true&w=majority"
        GEMINI_API_KEY: "mock_gemini_key_for_ci"
        TEST_MODE: "true"
        REMI_API_KEY: "test_admin_key_123"
      run: |
        pytest -v --cov=./ --cov-report=term-missing --cov-report=html --tb=short

    - name: Validar construcción de Docker Image
      run: |
        docker build -t remi-enterprise:test .

    - name: Mostrar resumen de test coverage
      if: always()
      run: |
        echo "✅ Pipeline de CI/CD completado exitosamente"
