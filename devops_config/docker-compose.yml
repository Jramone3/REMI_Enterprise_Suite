version: '3.8'

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - MONGO_URI=mongodb://mongo:27017/
      - REMI_DB_NAME=remi_enterprise
      - LLM_HOST=http://ollama:11434
      - BASE_RPC_URL=${BASE_RPC_URL:-https://mainnet.base.org}
      - REMI_PAYMENT_ADDRESS=${REMI_PAYMENT_ADDRESS}
      - EXPECTED_TOKEN_ADDRESS=${EXPECTED_TOKEN_ADDRESS:-}
      - EXPECTED_TOKEN_DECIMALS=${EXPECTED_TOKEN_DECIMALS:-6}
    depends_on:
      - mongo
      - ollama

  mongo:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  mongo-data:
  ollama-data:
